<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 54" width="1100" height="54" role="img" aria-labelledby="t d">
  <title id="t">Travel tech keywords</title>
  <desc id="d">Scrolling marquee listing NDC, GDS, offer and order, PNR, EDIFACT and related travel tech terms.</desc>
  <defs>
  <linearGradient id="gName" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.35" stop-color="#22d3ee"/>
    <stop offset="0.7" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#f472b6"/>
    <animate attributeName="x1" values="-0.6;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.4;2" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="46"/>
  </filter>
  <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#e8ecf8" fill-opacity="0.16"/>
  </pattern><clipPath id="tclip"><rect width="1100" height="54" rx="27"/></clipPath>
  <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#0a0f1e" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a0f1e" stop-opacity="0"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient></defs>
  <style>@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-2060px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

  <rect width="1100" height="54" rx="27" fill="#0a0f1e" stroke="#1c2540"/>
  <g clip-path="url(#tclip)">
    <g style="animation:slide 30s linear infinite">
      <text x="0" y="34" textLength="2060" lengthAdjust="spacing" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2.6" fill="url(#gName)" fill-opacity="0.9">NDC   ✦   OFFER / ORDER   ✦   GDS   ✦   AMADEUS   ✦   SABRE   ✦   TRAVELPORT   ✦   PNR   ✦   EDIFACT   ✦   REST / JSON   ✦   ANCILLARIES   ✦   SCHEDULES   ✦   TRAVEL TECH   ✦   </text>
      <text x="2060" y="34" textLength="2060" lengthAdjust="spacing" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2.6" fill="url(#gName)" fill-opacity="0.9">NDC   ✦   OFFER / ORDER   ✦   GDS   ✦   AMADEUS   ✦   SABRE   ✦   TRAVELPORT   ✦   PNR   ✦   EDIFACT   ✦   REST / JSON   ✦   ANCILLARIES   ✦   SCHEDULES   ✦   TRAVEL TECH   ✦   </text>
      <text x="4120" y="34" textLength="2060" lengthAdjust="spacing" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2.6" fill="url(#gName)" fill-opacity="0.9">NDC   ✦   OFFER / ORDER   ✦   GDS   ✦   AMADEUS   ✦   SABRE   ✦   TRAVELPORT   ✦   PNR   ✦   EDIFACT   ✦   REST / JSON   ✦   ANCILLARIES   ✦   SCHEDULES   ✦   TRAVEL TECH   ✦   </text>
    </g>
  </g>
  <rect width="90" height="54" fill="url(#fadeL)"/>
  <rect x="1010" width="90" height="54" fill="url(#fadeR)"/>
</svg>
