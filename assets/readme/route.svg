<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="t d">
  <title id="t">Route map: NDC to GDS to travel tech</title>
  <desc id="d">Animated dotted flight path linking NDC, GDS and travel tech, with a plane travelling between the three stops.</desc>
  <defs>
  <linearGradient id="gName" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.35" stop-color="#22d3ee"/>
    <stop offset="0.7" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#f472b6"/>
    <animate attributeName="x1" values="-0.6;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.4;2" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="46"/>
  </filter>
  <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#e8ecf8" fill-opacity="0.16"/>
  </pattern><linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080c18"/><stop offset="1" stop-color="#0c0a1c"/>
  </linearGradient></defs>
  <style>
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
    @keyframes ping{0%{opacity:.55;transform:scale(.85)}70%,100%{opacity:0;transform:scale(1.9)}}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect width="1100" height="300" rx="26" fill="url(#jbg)"/>
  <rect width="1100" height="300" rx="26" fill="url(#dots)" opacity="0.35"/>
  <rect x="1" y="1" width="1098" height="298" rx="26" fill="none" stroke="#1c2540"/>

  <text x="46" y="52" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="3.2" fill="#22d3ee" fill-opacity="0.85">CURRENT ITINERARY</text>
  <text x="46" y="80" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#8b98b8">how a ticket actually gets from an airline to a screen</text>

  <!-- route line -->
  <path d="M 150 168 L 950 168" stroke="#1c2540" stroke-width="2.4" fill="none"/>
  <path d="M 150 168 L 950 168" stroke="url(#gSweep)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 150 168 L 950 168" stroke="#e8ecf8" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-dasharray="2 14" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-160" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- plane flying the route -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M 150 168 L 950 168" keyPoints="0;1;1;0" keyTimes="0;0.45;0.55;1" calcMode="linear"/>
    <path d="M -13 0 L 9 -5 L 3 0 L 9 5 Z" fill="#fbbf24"/>
    <circle cx="-14" cy="0" r="7" fill="#fbbf24" fill-opacity="0.22" style="animation:tw 1.5s ease-in-out infinite"/>
  </g>
  <!-- contrail -->
  <circle r="3" fill="#22d3ee">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 150 168 L 950 168" keyPoints="0;0.9" keyTimes="0;1" begin="-0.9s"/>
    <animate attributeName="opacity" values="0.9;0" dur="9s" repeatCount="indefinite"/>
  </circle>

  
    <g>
      <circle cx="150" cy="168" r="26" fill="#22d3ee" fill-opacity="0.08"/>
      <circle cx="150" cy="168" r="26" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="150" cy="168" r="26" fill="none" stroke="#22d3ee" stroke-width="1.4" opacity="0">
        <animate attributeName="r" values="26;50" dur="3.4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;0" dur="3.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="168" r="7" fill="#22d3ee" style="animation:pulse 2.6s ease-in-out 0s infinite" transform-origin="150px 168px"/>
      <text x="150" y="114" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="2.4" fill="#e8ecf8">NDC</text>
      <text x="150" y="226" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8b98b8">New Distribution Capability</text>
      <text x="150" y="250" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="#8b98b8" fill-opacity="0.6">OFFER → ORDER</text>
    </g>
    <g>
      <circle cx="550" cy="168" r="26" fill="#22d3ee" fill-opacity="0.08"/>
      <circle cx="550" cy="168" r="26" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="550" cy="168" r="26" fill="none" stroke="#8b5cf6" stroke-width="1.4" opacity="0">
        <animate attributeName="r" values="26;50" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;0" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="550" cy="168" r="7" fill="#8b5cf6" style="animation:pulse 2.6s ease-in-out 0.4s infinite" transform-origin="550px 168px"/>
      <text x="550" y="114" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="2.4" fill="#e8ecf8">GDS</text>
      <text x="550" y="226" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8b98b8">Global Distribution System</text>
      <text x="550" y="250" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="#8b98b8" fill-opacity="0.6">AMADEUS · SABRE · TRAVELPORT</text>
    </g>
    <g>
      <circle cx="950" cy="168" r="26" fill="#22d3ee" fill-opacity="0.08"/>
      <circle cx="950" cy="168" r="26" fill="none" stroke="#f472b6" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="950" cy="168" r="26" fill="none" stroke="#f472b6" stroke-width="1.4" opacity="0">
        <animate attributeName="r" values="26;50" dur="3.4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;0" dur="3.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="168" r="7" fill="#f472b6" style="animation:pulse 2.6s ease-in-out 0.8s infinite" transform-origin="950px 168px"/>
      <text x="950" y="114" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="2.4" fill="#e8ecf8">TRAVEL TECH</text>
      <text x="950" y="226" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8b98b8">Airline retailing &amp; APIs</text>
      <text x="950" y="250" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="#8b98b8" fill-opacity="0.6">PNR · ANCILLARIES · EDIFACT</text>
    </g>
</svg>
