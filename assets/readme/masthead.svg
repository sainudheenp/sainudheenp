<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img">
  <title>Sainudheen — full-stack developer</title><desc>Masthead: name, one-line summary, location, and the areas of airline distribution currently being studied.</desc>
  <defs><clipPath id="clip"><rect width="1200" height="330" rx="14"/></clipPath>
      <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d9a961" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#d9a961"/>
        <stop offset="1" stop-color="#d9a961" stop-opacity="0"/>
      </linearGradient></defs>
  <style>
      .name{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:60px;font-weight:600;letter-spacing:-1.4px;fill:#e9ecf2}
      .lede{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:17px;fill:#7d8698}
      .lede-dim{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:11.5px;letter-spacing:1.4px;fill:#4d5567}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace}
      @media (prefers-reduced-motion: reduce){animate{display:none}}
    </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="#0a0c10"/>
    <path d="M32 0V330M64 0V330M96 0V330M128 0V330M160 0V330M192 0V330M224 0V330M256 0V330M288 0V330M320 0V330M352 0V330M384 0V330M416 0V330M448 0V330M480 0V330M512 0V330M544 0V330M576 0V330M608 0V330M640 0V330M672 0V330M704 0V330M736 0V330M768 0V330M800 0V330M832 0V330M864 0V330M896 0V330M928 0V330M960 0V330M992 0V330M1024 0V330M1056 0V330M1088 0V330M1120 0V330M1152 0V330M1184 0V330M0 32H1200M0 64H1200M0 96H1200M0 128H1200M0 160H1200M0 192H1200M0 224H1200M0 256H1200M0 288H1200M0 320H1200" stroke="#171c25" stroke-width="0.75" opacity="0.5"/>

    <text x="64" y="126" class="name">Sainudheen</text>

    <text x="64" y="170" class="lede">Full-stack developer. I build web products end to end and am</text>
    <text x="64" y="196" class="lede">currently working through how airline content is distributed.</text>

    <text x="64" y="228" class="lede-dim">Oman · UTC+4 · open to collaboration</text>

    
    <rect x="576" y="252" width="5" height="5" fill="#d9a961" opacity="0.9"/>
    <text x="591" y="259" class="mono" font-size="11.5" letter-spacing="2.6" fill="#7d8698">NDC</text>
    <rect x="766" y="252" width="5" height="5" fill="#d9a961" opacity="0.9"/>
    <text x="781" y="259" class="mono" font-size="11.5" letter-spacing="2.6" fill="#7d8698">GDS</text>
    <rect x="956" y="252" width="5" height="5" fill="#d9a961" opacity="0.9"/>
    <text x="971" y="259" class="mono" font-size="11.5" letter-spacing="2.6" fill="#7d8698">TRAVEL SYSTEMS</text>

    <!-- rule + slow sheen -->
    <path d="M64 272H1136" stroke="#1e2430" stroke-width="1"/>
    <rect x="64" y="271" width="150" height="2" fill="url(#sheen)">
      <animate attributeName="x" values="64;986;64" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.85;0.25" dur="18s" repeatCount="indefinite"/>
    </rect>
    <text x="1136" y="296" text-anchor="end" class="mono" font-size="10.5" letter-spacing="2.2" fill="#4d5567">sainudheen.tech</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="14" fill="none" stroke="#1e2430"/>
</svg>
